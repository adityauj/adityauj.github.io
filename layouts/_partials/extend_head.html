<style>
  .post-figure { margin: 1.5rem 0; text-align: center; }
  .post-figure img { max-width: 100%; height: auto; border-radius: 4px; }
  .post-figure img.zoomable { cursor: zoom-in; }
  #lightbox {
    position: fixed; inset: 0; z-index: 999;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .9); cursor: zoom-out; padding: 1rem;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var box = document.createElement("div");
    box.id = "lightbox";
    var big = document.createElement("img");
    box.appendChild(big);
    document.body.appendChild(box);

    document.querySelectorAll("img.zoomable").forEach(function (img) {
      img.addEventListener("click", function () {
        big.src = img.currentSrc || img.src;
        big.alt = img.alt;
        box.classList.add("open");
      });
    });

    function close() { box.classList.remove("open"); big.src = ""; }
    box.addEventListener("click", close);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });
  });
</script>
