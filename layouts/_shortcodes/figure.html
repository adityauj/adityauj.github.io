{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $isRemote := or (hasPrefix $src "http://") (hasPrefix $src "https://") -}}
<figure class="post-figure">
  {{- if $isRemote -}}
    <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy" class="zoomable">
  {{- else -}}
    {{- with .Page.Resources.GetMatch $src -}}
      <img src="{{ .RelPermalink }}" alt="{{ $alt }}"
           width="{{ .Width }}" height="{{ .Height }}"
           loading="lazy" class="zoomable">
    {{- else -}}
      {{- errorf "figure: no page resource %q in %q" $src $.Page.Path -}}
    {{- end -}}
  {{- end -}}
  {{- with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
